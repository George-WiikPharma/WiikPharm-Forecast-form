<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Nordic Forecast Form</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
*{box-sizing:border-box}
:root{--brand:#DE0059;--brand-dark:#B80049;--ink:#1A1A1A;--tint:#FCE6EE;--line:#E6DCE0;--muted:#5A4E53}
body{margin:0;background:#F7F5F6;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink)}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:16px;color:var(--ink)}
input:focus,select:focus,textarea:focus,button:focus-visible,a:focus-visible{outline:3px solid #F08AB0;outline-offset:1px}
.btn:hover{filter:brightness(.95)}
header{background:#fff;border-bottom:4px solid var(--brand)}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;padding-top:18px;padding-bottom:14px}
.brand{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.brand img{height:54px;width:auto;display:block}
.kick{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--brand-dark);font-weight:700}
h1{margin:4px 0 0;font-size:30px;line-height:1.15;font-weight:700}
.lang{display:flex;border:1.5px solid var(--ink);border-radius:10px;overflow:hidden}
.lang button{min-height:44px;min-width:64px;border:0;padding:0 16px;font-weight:600;font-size:15px;background:#fff;color:var(--ink)}
.lang button[aria-pressed=true]{background:var(--ink);color:#fff}
.prog{padding-bottom:16px}
.progtxt{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);margin-bottom:6px}
.bar{height:8px;border-radius:4px;background:#EADFE4;overflow:hidden}
.bar div{height:8px;background:var(--brand);width:0;transition:width .2s}
main{padding-top:24px;padding-bottom:64px;display:flex;flex-direction:column;gap:24px}
.card{background:#fff;border-radius:16px;padding:24px;border:1px solid var(--line);display:flex;flex-direction:column;gap:16px}
h2{margin:0;font-size:22px;display:flex;gap:12px;align-items:center}
h2 span{width:32px;height:32px;border-radius:16px;background:var(--ink);color:#fff;font-size:16px;display:flex;align-items:center;justify-content:center;flex:none}
.sub{margin:0;font-size:15px;line-height:1.45;color:#4A3F44}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.steps div{display:flex;gap:12px;align-items:flex-start;font-size:15px;line-height:1.4}
.steps b{flex:none;width:32px;height:32px;border-radius:16px;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center}
.tip{background:var(--tint);border-radius:10px;padding:12px 14px;font-size:15px;line-height:1.45}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.f{display:flex;flex-direction:column;gap:6px}
.f label{font-weight:600;font-size:15px}
.small{font-size:13px;color:var(--muted)}
.txt,select,textarea{min-height:48px;border:1.5px solid #9A8A90;border-radius:10px;padding:0 12px;background:#fff;width:100%}
textarea{padding:10px 12px;resize:vertical}
.prod{background:#fff;border-radius:16px;border:2px solid var(--line);padding:20px;display:flex;flex-direction:column;gap:14px}
.prod.done{border-color:var(--brand)}
.ph{display:flex;flex-wrap:wrap;gap:8px 16px;justify-content:space-between;align-items:flex-start}
.ph .l{flex:1 1 340px}
.ln{font-size:13px;color:var(--muted);font-weight:600}
.pn{font-size:18px;font-weight:600;line-height:1.3}
.un{font-size:14px;color:var(--muted)}
.none{min-height:44px;padding:0 16px;border-radius:22px;font-weight:600;font-size:15px;border:1.5px solid #6B5E64;background:#fff;color:var(--ink)}
.none[aria-pressed=true]{background:var(--ink);color:#fff}
.hint{background:var(--tint);border-radius:10px;padding:10px 12px;font-size:14px;line-height:1.4}
.num{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.num button{width:48px;height:48px;border-radius:10px;border:1.5px solid var(--brand);background:#fff;color:var(--brand-dark);font-size:24px;font-weight:600}
.num input{width:100px;min-height:48px;text-align:center;font-size:20px;font-weight:600;border:2px solid var(--brand);border-radius:10px}
.num input:disabled{background:#F1EBED}
.chk{display:flex;gap:8px;align-items:center;font-size:15px;min-height:44px}
.chk input{width:22px;height:22px;accent-color:var(--brand)}
.link{align-self:flex-start;min-height:44px;padding:0 4px;border:0;background:transparent;color:var(--brand-dark);font-weight:600;font-size:15px;text-decoration:underline}
.more{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;background:#F7F5F6;border-radius:12px;padding:14px}
.more .wide{grid-column:1/-1}
.split{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{min-height:48px;padding:0 16px;border-radius:24px;font-size:15px;font-weight:600;border:2px solid var(--brand);background:#fff;color:var(--brand-dark)}
.chip[aria-pressed=true]{background:var(--brand);color:#fff}
.other{border:2px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;background:#FFFDFD}
table{border-collapse:collapse;width:100%;min-width:520px;font-size:14px}
th{background:var(--tint);text-align:left;padding:10px 12px}
td{padding:9px 12px;border-top:1px solid #EFE6EA}
td.r,th.r{text-align:right;font-weight:600}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
.warn{background:#FFF4D6;border-radius:10px;padding:12px 14px;font-size:15px;line-height:1.45}
.acts{display:flex;flex-wrap:wrap;gap:12px}
.primary{min-height:52px;padding:0 24px;border-radius:12px;background:var(--brand);color:#fff;font-weight:700;font-size:17px;display:inline-flex;align-items:center;text-decoration:none}
.second{min-height:52px;padding:0 20px;border-radius:12px;border:2px solid var(--brand);background:#fff;color:var(--brand-dark);font-weight:700;font-size:16px}
</style>
